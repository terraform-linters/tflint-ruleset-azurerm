name: lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Set up Go
      uses: actions/setup-go@v7.1.0
      with:
        go-version-file: 'go.mod'
    - name: Run linters
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        make tools lint
