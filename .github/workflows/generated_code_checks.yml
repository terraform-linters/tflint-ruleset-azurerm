name: generated-code

on: pull_request

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        submodules: true
    - name: Set up Go
      uses: actions/setup-go@v7.1.0
      with:
        go-version-file: 'go.mod'
    - name: go run ./apispec-rule-gen
      working-directory: ./tools
      run: go run ./apispec-rule-gen && git diff --exit-code
